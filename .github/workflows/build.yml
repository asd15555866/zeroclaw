name: Build ZeroClaw for ARM64 (musl + Web Dashboard)

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'build-*'     # 推送 build-xxx 标签自动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: v0.8.3

      - name: Install Rust + musl target
        run: |
          rustup update stable
          rustup target add aarch64-unknown-linux-musl
          rustup component add rust-src

      - name: Install cross-compile linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # 安装 aarch64 musl 交叉编译器
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
          tar xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> $GITHUB_ENV

      - name: Build
        run: |
          cargo build --profile dist \
            --target aarch64-unknown-linux-musl \
            --features "agent-runtime,gateway,acp-bridge,observability-prometheus,schema-export,embedded-web,sandbox-landlock,browser-native,channel-acp-server,channel-webhook,channel-email,channel-telegram,channel-filesystem,channel-mqtt,channel-wechat"

      - name: Package
        run: |
          mkdir -p release
          cp target/aarch64-unknown-linux-musl/dist/zeroclaw release/
          cd release && tar czf ../zeroclaw-aarch64-musl-dashboard.tar.gz zeroclaw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-aarch64-musl-dashboard
          path: zeroclaw-aarch64-musl-dashboard.tar.gz
