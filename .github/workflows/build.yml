name: Build ZeroClaw for ARM64 (中文 Web Dashboard + Rust 翻译)

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 字典翻译 Rust 源码中的英文字段
        run: python3 .github/translate_rust.py

      - name: AI 翻译字典未覆盖的剩余英文 (Google Translate)
        run: python3 .github/ai_translate_fallback.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build web dashboard
        run: |
          cd web
          npm install
          cat > src/lib/api-generated.ts << 'EOF'
          export {};
          EOF
          cat > src/lib/api-descriptions.ts << 'EOF'
          export function fieldHelp(_key: string): string { return ""; }
          EOF
          cat > src/lib/api-enums.ts << 'EOF'
          export function enumMembers(_key: string): string[] { return []; }
          EOF
          npx vite build

      - name: Install cross (prebuilt)
        run: |
          curl -LsSf https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x cross
          mv cross /usr/local/bin/

      - name: Build zeroclaw (ARM64 musl)
        run: |
          cross build --profile dist \
            --target aarch64-unknown-linux-musl \
            --features "agent-runtime,gateway,acp-bridge,observability-prometheus,schema-export,embedded-web,sandbox-landlock,browser-native,channel-acp-server,channel-webhook,channel-email,channel-telegram,channel-filesystem,channel-mqtt,channel-wechat"

      - name: Package
        run: |
          mkdir -p release
          cp target/aarch64-unknown-linux-musl/dist/zeroclaw release/
          tar czf zeroclaw-aarch64-musl-dashboard.tar.gz -C release zeroclaw
          ls -lh zeroclaw-aarch64-musl-dashboard.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-aarch64-musl-dashboard
          path: zeroclaw-aarch64-musl-dashboard.tar.gz
