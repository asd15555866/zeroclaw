[package]
name = "zeroclaw-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Configuration schema, secrets, and related types for ZeroClaw."
publish = false

[dependencies]
zeroclaw-log.workspace = true
zeroclaw-api.workspace = true
zeroclaw-macros.workspace = true
anyhow = "1.0"
clap = { version = "4.5", optional = true, default-features = false, features = ["std", "derive"] }
# OnboardUi needs dyn-compat; native AFIT isn't dyn-safe. Already built for api/channels/runtime.
async-trait = "0.1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6.0"
hex = "0.4"
hostname = "0.4.2"
parking_lot = "0.12"
postgres = { version = "0.19", default-features = false, features = ["with-chrono-0_4"], optional = true }
rand = "0.10"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "__rustls-ring"] }
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
schemars = { version = "1.2", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
shellexpand = "3.1"
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["fs", "io-util", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-socks = "0.5"
tokio-stream = { version = "0.1.18", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls-pki-types = "1.14.0"
toml = "1.0"
toml_edit = "0.25"
url = "2.5"
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }
webpki-roots = "1.0.6"

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }

[features]
# schema-export and clap are the only defaults. All channel schema types
# compile unconditionally; channel feature flags live in zeroclaw-channels only.
default = ["schema-export", "clap"]
schema-export = ["dep:schemars"]
clap = ["dep:clap"]
memory-postgres = ["dep:postgres"]

# ------------------------------------------------------------------
# Feature-awareness flags for config visibility filtering.
# These pull zero dependencies — they only gate cfg!(feature = "...")
# checks in field_visibility so the web dashboard hides config sections
# for subsystems that weren't compiled into the binary.
#
# Naming convention: _cfg-<root-feature-name> so they don't collide
# with the dep:postgres style features above.
# ------------------------------------------------------------------
_cfg-gateway = []
_cfg-hardware = []
_cfg-peripheral-rpi = []
_cfg-probe = []
_cfg-sandbox-landlock = []
_cfg-sandbox-bubblewrap = []
_cfg-browser-native = []
_cfg-plugins-wasm = []
_cfg-webauthn = []
_cfg-acp-bridge = []
_cfg-observability-prometheus = []
_cfg-observability-otel = []

# Per-channel config visibility (each matches a root channel-* feature)
_cfg-channel-acp-server = []
_cfg-channel-amqp = []
_cfg-channel-bluesky = []
_cfg-channel-clawdtalk = []
_cfg-channel-dingtalk = []
_cfg-channel-discord = []
_cfg-channel-email = []
_cfg-channel-filesystem = []
_cfg-channel-git = []
_cfg-channel-imessage = []
_cfg-channel-irc = []
_cfg-channel-lark = []
_cfg-channel-line = []
_cfg-channel-linq = []
_cfg-channel-mattermost = []
_cfg-channel-matrix = []
_cfg-channel-mochat = []
_cfg-channel-mqtt = []
_cfg-channel-nextcloud = []
_cfg-channel-nostr = []
_cfg-channel-notion = []
_cfg-channel-qq = []
_cfg-channel-reddit = []
_cfg-channel-signal = []
_cfg-channel-slack = []
_cfg-channel-telegram = []
_cfg-channel-twitch = []
_cfg-channel-twitter = []
_cfg-channel-voice-call = []
_cfg-channel-wati = []
_cfg-channel-wechat = []
_cfg-channel-wecom = []
_cfg-channel-wecom-ws = []
_cfg-channel-webhook = []
_cfg-channel-whatsapp-cloud = []
_cfg-whatsapp-web = []
